<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./build/three.module.js","three/addons/":"./examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { CUSTOM } from './custom.js';

const loader = new GLTFLoader();
const cache = new Map();
async function load(kit, model) {
  const key = kit + '/' + model;
  if (!cache.has(key)) {
    cache.set(key, new Promise((res, rej) => loader.load(`./kenney/${kit}/Models/GLB format/${model}.glb`, (g) => res(g.scene), undefined, rej)));
  }
  return (await cache.get(key)).clone(true);
}

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

// Shift Kenney's cool teal greens toward warm yellow-greens (cozy palette); greys untouched.
function warmRGB(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn;
  if (d < 0.2) return [r * 255, g * 255, b * 255];
  const s = l > 0.5 ? d / (2 - mx - mn) : d / (mx + mn);
  let h = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) / 6 : mx === g ? ((b - r) / d + 2) / 6 : ((r - g) / d + 4) / 6;
  if (h > 0.36 && h < 0.56 && s > 0.2) h = 0.27 + (h - 0.36) * 0.35; else return [r * 255, g * 255, b * 255];
  const s2 = Math.min(1, s * 0.92);
  const q = l < 0.5 ? l * (1 + s2) : l + s2 - l * s2, p = 2 * l - q;
  const f = (t) => { t = (t + 1) % 1; return t < 1 / 6 ? p + (q - p) * 6 * t : t < 0.5 ? q : t < 2 / 3 ? p + (q - p) * (2 / 3 - t) * 6 : p; };
  return [f(h + 1 / 3) * 255, f(h) * 255, f(h - 1 / 3) * 255];
}

function grade(obj, opts) {
  obj.traverse((o) => {
    if (!o.isMesh) return;
    o.castShadow = true;
    o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map((m) => {
      const c = m.clone();
      if (opts.desat > 0 || opts.tint || opts.warm) {
        // Bake the grade into the colormap pixels (Kenney models use a palette texture).
        if (c.map && c.map.image) {
          const img = c.map.image;
          const cv = document.createElement('canvas');
          cv.width = img.width; cv.height = img.height;
          const g = cv.getContext('2d');
          g.drawImage(img, 0, 0);
          const d = g.getImageData(0, 0, cv.width, cv.height);
          const t = opts.tint ? (() => { const h = parseInt(opts.tint.slice(1), 16); return { r: ((h >> 16) & 255) / 255, g: ((h >> 8) & 255) / 255, b: (h & 255) / 255 }; })() : null;
          for (let i = 0; i < d.data.length; i += 4) {
            let r = d.data[i], gg = d.data[i + 1], b = d.data[i + 2];
            if (t) { const k = opts.tintK ?? 0.5; const L = (r * 0.3 + gg * 0.59 + b * 0.11) / 255; const f = Math.min(1.2, 0.62 + L * 0.6); r = r * (1 - k) + t.r * 255 * k * f; gg = gg * (1 - k) + t.g * 255 * k * f; b = b * (1 - k) + t.b * 255 * k * f; }
            if (opts.warm) { const o = warmRGB(r, gg, b); r = o[0]; gg = o[1]; b = o[2]; }
            const y = r * 0.3 + gg * 0.59 + b * 0.11;
            const k2 = opts.desat || 0;
            d.data[i] = r + (y * 0.95 + 10 - r) * k2;
            d.data[i + 1] = gg + (y * 0.93 + 8 - gg) * k2;
            d.data[i + 2] = b + (y * 0.9 + 12 - b) * k2;
          }
          g.putImageData(d, 0, 0);
          const tex = new THREE.CanvasTexture(cv);
          tex.colorSpace = THREE.SRGBColorSpace;
          tex.flipY = c.map.flipY;
          tex.magFilter = c.map.magFilter; tex.minFilter = c.map.minFilter;
          c.map = tex;
        } else if (c.color) {
          if (opts.tint) {
            const t = new THREE.Color(opts.tint);
            const k = opts.tintK ?? 0.5;
            const L = (c.color.r * 0.3 + c.color.g * 0.59 + c.color.b * 0.11);
            const f = Math.min(1.25, 0.35 + L * 1.6);
            c.color.setRGB(c.color.r * (1 - k) + t.r * k * f, c.color.g * (1 - k) + t.g * k * f, c.color.b * (1 - k) + t.b * k * f);
          }
          if (opts.warm) { const sr = c.color.clone().convertLinearToSRGB(); const o = warmRGB(sr.r * 255, sr.g * 255, sr.b * 255); c.color.setRGB(o[0] / 255, o[1] / 255, o[2] / 255, THREE.SRGBColorSpace); }
          const y = c.color.r * 0.3 + c.color.g * 0.59 + c.color.b * 0.11;
          c.color.lerp(new THREE.Color(y, y * 0.98, y * 0.96), opts.desat || 0);
        }
      }
      if (c.roughness !== undefined) c.roughness = Math.max(c.roughness, 0.75);
      if (c.metalness !== undefined) c.metalness = Math.min(c.metalness, 0.1);
      return c;
    });
    o.material = Array.isArray(o.material) ? out : out[0];
  });
}

window.renderSpec = async (spec) => {
  const W = spec.w ?? spec.size ?? 256, H = spec.h ?? spec.size ?? 256;
  renderer.toneMappingExposure = spec.exposure ?? 1.0;
  renderer.setSize(W, H, false);
  const scene = new THREE.Scene();
  const root = new THREE.Group();
  scene.add(root);
  const placed = [];
  for (const it of spec.items) {
    const m = it.custom ? CUSTOM[it.custom](it) : await load(it.kit, it.model);
    m.rotation.set(((it.rx ?? 0) * Math.PI) / 180, ((it.ry ?? 0) * Math.PI) / 180, ((it.rz ?? 0) * Math.PI) / 180);
    let s = it.s ?? 1;
    if (it.fit) {
      const b0 = new THREE.Box3().setFromObject(m);
      const sz = b0.getSize(new THREE.Vector3());
      s *= it.fit / Math.max(sz.x, sz.y, sz.z, 1e-6);
    }
    m.scale.set(s * (it.sx ?? 1), s * (it.sy ?? 1), s * (it.sz ?? 1));
    m.position.set(0, 0, 0);
    m.updateMatrixWorld(true);
    const own = new THREE.Box3().setFromObject(m);
    if (it.on !== undefined && placed[it.on]) {
      const base = new THREE.Box3().setFromObject(placed[it.on]);
      const bc = base.getCenter(new THREE.Vector3());
      m.position.set(bc.x + (it.x ?? 0), base.max.y - own.min.y + (it.y ?? 0), bc.z + (it.z ?? 0));
    } else {
      m.position.set(it.x ?? 0, (it.y ?? 0) - (it.ground === false ? 0 : own.min.y), it.z ?? 0);
    }
    grade(m, { desat: it.desat ?? spec.desat ?? 0, tint: it.tint, tintK: it.tintK, warm: it.warm ?? spec.warm ?? true });
    root.add(m);
    root.updateMatrixWorld(true);
    placed.push(m);
  }
  // Fit
  const box = new THREE.Box3().setFromObject(root);
  const _h = box.max.y - box.min.y;
  const fitBox = box.clone();
  if (spec.shadow !== false) { fitBox.max.x += _h * 0.45; fitBox.min.z -= _h * 0.55; }
  const center = box.getCenter(new THREE.Vector3());
  const sizeV = box.getSize(new THREE.Vector3());
  const yaw = ((spec.yaw ?? 45) * Math.PI) / 180;
  const pitch = ((spec.pitch ?? 30) * Math.PI) / 180;
  const dist = 50;
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  // Project bounding box corners to camera space to fit ortho frustum.
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 500);
  cam.position.copy(center).addScaledVector(dir, dist);
  cam.lookAt(center);
  cam.updateMatrixWorld();
  const inv = cam.matrixWorldInverse;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const x of [fitBox.min.x, fitBox.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [fitBox.min.z, fitBox.max.z]) {
    const p = new THREE.Vector3(x, y, z).applyMatrix4(inv);
    minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y);
  }
  const pad = spec.pad ?? 0.08;
  let hw = (maxX - minX) / 2, hh = (maxY - minY) / 2;
  const cx = (maxX + minX) / 2, cy = (maxY + minY) / 2;
  const aspect = W / H;
  if (spec.fixedScale) { hw = spec.fixedScale * aspect; hh = spec.fixedScale; }
  else if (hw / hh > aspect) hh = hw / aspect; else hw = hh * aspect;
  hw *= 1 + pad * 2; hh *= 1 + pad * 2;
  const anchorBottom = spec.anchor === 'bottom';
  const oy = anchorBottom ? minY + hh - (maxY - minY) * 0 - hh * (pad) : cy;
  cam.left = cx - hw; cam.right = cx + hw; cam.top = (anchorBottom ? minY - hh * pad * 2 + 2 * hh : cy + hh); cam.bottom = (anchorBottom ? minY - hh * pad * 2 : cy - hh);
  void oy;
  cam.updateProjectionMatrix();
  // Lights: warm key from upper-left, cool soft sky, warm bounce.
  scene.add(new THREE.HemisphereLight(0xfff4e6, 0x9fb488, 1.15));
  const key = new THREE.DirectionalLight(0xffe0b0, 2.6);
  const kd = new THREE.Vector3(-0.55, 1.0, 0.65).normalize();
  key.position.copy(center).addScaledVector(kd, 30);
  key.target.position.copy(center);
  scene.add(key.target);
  key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048);
  const r = Math.max(sizeV.x, sizeV.z, sizeV.y) * 1.2 + 1;
  Object.assign(key.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 0.1, far: 120 });
  key.shadow.bias = -0.0008;
  key.shadow.normalBias = 0.02;
  key.shadow.radius = 6;
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xcfe3ff, 0.55);
  fill.position.copy(center).add(new THREE.Vector3(6, 3, -4));
  scene.add(fill);
  if (spec.shadow !== false) {
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(r * 6, r * 6), new THREE.ShadowMaterial({ opacity: spec.shadowOpacity ?? 0.28, color: 0x3b2a1e }));
    plane.rotation.x = -Math.PI / 2;
    plane.position.set(center.x, box.min.y + 0.001, center.z);
    plane.receiveShadow = true;
    scene.add(plane);
  }
  renderer.render(scene, cam);
  // Ground anchor (base centre) in pixels, and pixels per world unit.
  const g = new THREE.Vector3(center.x, box.min.y, center.z).project(cam);
  const anchor = [((g.x + 1) / 2) * W, ((1 - g.y) / 2) * H];
  const unitPx = W / (cam.right - cam.left);
  let url = renderer.domElement.toDataURL('image/png');
  if (spec.glow) {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    const c2 = cv.getContext('2d');
    const gx = W / 2, gy = H * (spec.glowY ?? 0.45), gr = W * (spec.glowR ?? 0.46);
    const grd = c2.createRadialGradient(gx, gy, 0, gx, gy, gr);
    grd.addColorStop(0, spec.glow); grd.addColorStop(1, 'rgba(255,255,255,0)');
    c2.globalAlpha = spec.glowA ?? 0.55; c2.fillStyle = grd; c2.fillRect(0, 0, W, H); c2.globalAlpha = 1;
    c2.drawImage(renderer.domElement, 0, 0);
    url = cv.toDataURL('image/png');
  }
  return { url, anchor, unitPx };
};
window.ready = true;
</script></body></html>
